<!doctype html>
<!--
  00 · Signal: the November teaser, 8 s, 1080 × 1920, 120 BPM (a beat every 0.5 s).
  Static, then the neon mark lights up through it (the same flicker as on the site),
  a hard glitch on the drop, the date, and the picture switching off like an old TV.
  Render: node brand/social/video/_build/render.mjs brand/social/video/00-signal/signal.html brand/social/video/00-signal/signal.mp4
  Everything important sits between y 300 and 1620, so the centre-cropped 4:5 feed cut keeps it.
-->
<html>
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;600&display=block');
:root { --ink:#0A0A0B; --paper:#F2F1EE; --ember:#E8613C; --pink:255 61 154; --cyan:56 214 255; --muted:#A3A3A8; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:1080px; height:1920px; overflow:hidden; background:#000; color:var(--paper); font-family:'Archivo', sans-serif; }
#screen { position:absolute; inset:0; background:var(--ink); overflow:hidden; transform-origin:50% 50%; }
.full { position:absolute; inset:0; }
#static { width:100%; height:100%; image-rendering:pixelated; }
#scan { background:repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0 2px, transparent 2px 5px); }
#vignette { background:radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(0,0,0,.75) 100%); }
.mono { font-family:'JetBrains Mono', monospace; text-transform:uppercase; letter-spacing:.16em; }
.display { font-weight:800; font-stretch:125%; text-transform:uppercase; letter-spacing:-0.035em; line-height:.9; }

#hud { position:absolute; top:300px; left:64px; right:64px; display:flex; justify-content:space-between; font-size:24px; }
#hud .rec::before { content:''; display:inline-block; width:14px; height:14px; border-radius:50%; background:var(--ember); margin-right:12px; vertical-align:1px; }
#nosignal { position:absolute; top:920px; left:50%; transform:translateX(-50%); padding:14px 26px; background:#000; font-size:34px; white-space:nowrap; }

/* The neon mark, built like components/ui/NeonMark.tsx: blurred glow, coloured tube, white-hot core. */
#mark { position:absolute; left:50%; top:600px; width:460px; aspect-ratio:589 / 667; transform:translateX(-50%); isolation:isolate; }
.layer { position:absolute; inset:0; -webkit-mask:url('/public/brand/logo-white.png') center / contain no-repeat; mask:url('/public/brand/logo-white.png') center / contain no-repeat; }
.tube { background:linear-gradient(115deg, var(--ember) 0%, rgb(var(--pink)) 30%, rgb(var(--cyan)) 55%, rgb(var(--pink)) 78%, var(--ember) 100%); background-size:320% 320%; }
#glow { position:absolute; inset:0; filter:blur(30px) saturate(1.6); z-index:-1; }
.core { background:rgb(255 248 244 / .35); }
.ghost { mix-blend-mode:screen; }
#ghostR { background:rgb(var(--pink)); }
#ghostC { background:rgb(var(--cyan)); }

.copy { position:absolute; left:0; right:0; text-align:center; }
.split { text-shadow:calc(var(--s, 0px) * -1) 0 rgb(var(--pink)), var(--s, 0px) 0 rgb(var(--cyan)); }
#title { top:700px; }
#title .display { font-size:132px; }
#title .mono { margin-top:34px; font-size:28px; color:var(--muted); }
#date { top:560px; }
#date .kicker { font-size:30px; }
#date .display { font-size:290px; margin-top:30px; }
#date .day { margin-top:40px; font-size:34px; }
#date .url { margin-top:250px; font-size:26px; color:var(--muted); }

/* Torn bands: copies of the whole screen content, sliced and shoved sideways. */
.tear { position:absolute; inset:0; visibility:hidden; background:var(--ink); }
#line { position:absolute; left:0; right:0; top:50%; height:6px; margin-top:-3px; background:#fff; box-shadow:0 0 40px 8px rgba(255,255,255,.7); opacity:0; }
</style>
</head>
<body>
<div id="screen">
  <div id="content" class="full">
    <canvas id="static" class="full" width="216" height="384"></canvas>
    <div id="nosignal" class="mono">No signal</div>
    <div id="mark">
      <div id="glow"><div class="layer tube"></div></div>
      <div class="layer tube" id="tube"></div>
      <div class="layer core"></div>
      <div class="layer ghost" id="ghostR"></div>
      <div class="layer ghost" id="ghostC"></div>
    </div>
    <div id="title" class="copy">
      <div class="display split">Final<br>Heaven</div>
      <div class="mono">November transmission</div>
    </div>
    <div id="date" class="copy">
      <div class="mono kicker">Checkout opens</div>
      <div class="display split">13.11</div>
      <div class="mono day">Friday 13 November</div>
      <div class="mono url">finalheaven.shop</div>
    </div>
  </div>
  <div id="tears"></div>
  <div id="scan" class="full"></div>
  <div id="vignette" class="full"></div>
  <div id="hud" class="mono"><span class="rec">FH · TX</span><span id="tc"></span></div>
</div>
<div id="line"></div>

<script src="../_build/fx.js"></script>
<script>
const { rng, seg, clamp, easeOut, easeIn, hit, frame, staticNoise, tears, timecode, ready } = FX
const $ = (id) => document.getElementById(id)
const canvas = $('static')

// Three torn copies of the content layer (cloned once; their slices change per frame).
const tearLayers = [0, 1, 2].map(() => {
  const el = document.createElement('div')
  el.className = 'tear'
  el.appendChild($('content').cloneNode(true))
  el.querySelectorAll('[id]').forEach((n) => n.removeAttribute('id'))
  $('tears').appendChild(el)
  return el
})

// The site's neon-ignite flicker (app/globals.css), as opacity over 0..1 of the ignition.
const IGNITE = [[0, 0], [0.08, 0.85], [0.12, 0.12], [0.2, 0.9], [0.25, 0.3], [0.36, 1], [0.42, 0.65], [0.48, 1], [1, 1]]
function ignite(p) {
  for (let i = 1; i < IGNITE.length; i++) {
    const [x1, y1] = IGNITE[i], [x0, y0] = IGNITE[i - 1]
    if (p <= x1) return y0 + ((p - x0) / (x1 - x0)) * (y1 - y0)
  }
  return 1
}

// Timeline (seconds). The drop lands on beat 8 (4.0 s).
const IGNITE_AT = 1.5, DROP = 4.0, TITLE = 4.3, DATE = 5.3, OFF = 6.9

window.renderFrame = (t) => {
  const f = frame(t)

  // Static: full at the start, thinning as the mark lights, a trace under the type, back for the loop.
  const staticLevel = t < IGNITE_AT ? 1 : t < DROP ? 1 - 0.8 * seg(t, IGNITE_AT, 2.6) : t < 7.6 ? 0.07 : seg(t, 7.6, 8)
  canvas.style.opacity = staticLevel
  if (staticLevel > 0) staticNoise(canvas, f * 7919 + 1, 0.55)

  // "No signal" blinks once a second until the mark appears.
  $('nosignal').style.opacity = t < IGNITE_AT && t % 1 < 0.6 ? 1 : 0

  // The mark: ignites with the site's flicker, the colour drifting; colour split shrinks as it locks on.
  const markOn = t >= IGNITE_AT && t < TITLE
  const lit = markOn ? ignite(seg(t, IGNITE_AT, IGNITE_AT + 1.3)) : 0
  const punch = t >= DROP && t < DROP + 0.2 ? 1.08 - 0.4 * (t - DROP) : 1
  $('mark').style.opacity = lit
  $('mark').style.transform = `translateX(-50%) scale(${punch})`
  const drift = `${(t * 6) % 100}% ${30 + 40 * seg(t, 0, 8)}%`
  document.querySelectorAll('#mark .tube').forEach((el) => (el.style.backgroundPosition = drift))
  let split = markOn ? 26 * (1 - easeOut(seg(t, IGNITE_AT, 2.6))) + 3 : 0
  if (hit(t, 3.0) || hit(t, 3.5)) split = 18
  if (t >= DROP && t < DROP + 0.2) split = 60
  $('ghostR').style.transform = `translateX(${-split}px)`
  $('ghostC').style.transform = `translateX(${split}px)`
  $('ghostR').style.opacity = $('ghostC').style.opacity = clamp(split / 30) * 0.8

  // Title, then the date; the type gets its own colour split on the beats.
  $('title').style.opacity = t >= TITLE && t < DATE ? 1 : 0
  $('title').style.setProperty('--s', `${t < TITLE + 0.1 ? 20 : hit(t, 4.5) || hit(t, 5.0) ? 14 : 3}px`)
  $('date').style.opacity = t >= DATE && t < OFF + 0.45 ? 1 : 0
  const dateSplit = t < DATE + 0.1 ? 22 : [5.5, 6.0, 6.5].some((b) => hit(t, b)) ? 14 : 3
  $('date').style.setProperty('--s', `${dateSplit}px`)
  $('date').querySelector('.display').style.transform = `scale(${1 + 0.06 * (1 - easeOut(seg(t, DATE, DATE + 0.4)))})`

  // Torn bands on the glitch hits: two frames each, heavy on the drop and the cut to the date.
  let tearAmount = 0
  if (hit(t, 3.0) || hit(t, 3.5)) tearAmount = 0.5
  if (t >= DROP && t < DROP + 0.2) tearAmount = 1.2
  if (hit(t, DATE, 3)) tearAmount = 1
  if (hit(t, 6.0)) tearAmount = 0.4
  tears(tearLayers, f * 131 + 7, tearAmount)
  // The tear copies must show this frame's state, so copy it across (a cloned canvas comes out blank).
  if (tearAmount > 0) tearLayers.forEach((el) => {
    el.firstChild.replaceWith($('content').cloneNode(true))
    el.querySelectorAll('[id]').forEach((n) => n.removeAttribute('id'))
    el.querySelector('canvas').getContext('2d').drawImage(canvas, 0, 0)
  })

  // A black frame after the drop: the cut, not a flash.
  $('content').style.visibility = t >= DROP + 0.2 && t < TITLE ? 'hidden' : 'visible'

  // Switch-off: the picture squeezes to a bright line, the line to a dot, then black.
  const squeeze = easeIn(seg(t, OFF, OFF + 0.25))
  const narrow = easeIn(seg(t, OFF + 0.25, OFF + 0.45))
  const off = t >= OFF && t < 7.6
  $('screen').style.transform = off ? `scale(${1 - narrow}, ${Math.max(0.003, 1 - squeeze)})` : 'none'
  $('screen').style.filter = off ? `brightness(${1 + 3 * squeeze})` : 'none'
  $('line').style.opacity = t >= OFF + 0.2 && t < OFF + 0.7 ? 1 - seg(t, OFF + 0.45, OFF + 0.7) : 0
  $('line').style.transform = `scaleX(${1 - narrow * 0.98})`
  $('screen').style.opacity = t >= OFF + 0.45 && t < 7.6 ? 0 : 1

  $('tc').textContent = timecode(t)
}

// Sound: static hiss under the start, zaps on the flickers and glitches, a boom on the drop.
window.cues = [
  { at: 0, kind: 'hiss', dur: 2.7 },
  { at: 1.5, kind: 'zap' }, { at: 1.66, kind: 'zap' }, { at: 1.83, kind: 'zap' },
  { at: 3.0, kind: 'zap' }, { at: 3.5, kind: 'zap' },
  { at: 4.0, kind: 'boom' }, { at: 4.0, kind: 'zap' },
  { at: 4.5, kind: 'tick' }, { at: 5.0, kind: 'tick' },
  { at: 5.3, kind: 'zap' }, { at: 5.5, kind: 'tick' }, { at: 6.0, kind: 'tick' }, { at: 6.5, kind: 'tick' },
  { at: 6.9, kind: 'off' },
  { at: 7.6, kind: 'hiss', dur: 0.4 },
]

window.ready = Promise.all([ready(), document.fonts.load('800 100px Archivo'), document.fonts.load('400 20px "JetBrains Mono"')])
  .then(() => new Promise((r) => { const img = new Image(); img.onload = img.onerror = r; img.src = '/public/brand/logo-white.png' }))
  .then(() => renderFrame(0))
</script>
</body>
</html>
